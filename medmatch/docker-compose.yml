services:
  medmatch:
    # Build the image outside the VPS; this host only loads and runs it.
    image: medmatch-api:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MEDMATCH_DB: /data/medmatch.db
      MEDMATCH_DB_MANIFEST: /data/medmatch.db.manifest.json
      MEDMATCH_R5_EVALUATION: /data/medmatch.db.evaluation.json
      MEDMATCH_DB_READ_ONLY: "1"
      REQUIRE_R5_EVALUATION: "1"
      CANONICAL_EVIDENCE_READ: "1"
      SCANNER_DATA_DIR: /data/devices
      RATE_LIMIT_DB: /data/state/rate-limit.db
      PRODUCT_GRAPH_DB: /data/graph/product-graph.db
      TRUST_PROXY_HEADERS: "1"
      WEB_CONCURRENCY: "2"
    volumes:
      - ${MEDMATCH_RUNTIME_DIR:-/srv/medmatch/runtime}/medmatch.db:/data/medmatch.db:ro
      - ${MEDMATCH_RUNTIME_DIR:-/srv/medmatch/runtime}/medmatch.db.manifest.json:/data/medmatch.db.manifest.json:ro
      - ${MEDMATCH_RUNTIME_DIR:-/srv/medmatch/runtime}/medmatch.db.evaluation.json:/data/medmatch.db.evaluation.json:ro
      - ${MEDMATCH_DEVICES_DIR:-/srv/medmatch/devices}:/data/devices
      - ${MEDMATCH_STATE_DIR:-/srv/medmatch/state}:/data/state
      - ${MEDMATCH_GRAPH_DIR:-/srv/medmatch/graph}:/data/graph
    expose:
      - "8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 4g
    cpus: 2.0

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      MEDMATCH_DOMAIN: ${MEDMATCH_DOMAIN:?MEDMATCH_DOMAIN must be set in .env}
    depends_on:
      medmatch:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
